workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: me

    environment:
      flutter: stable
      xcode: 16.2
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - trivia_he
        certificates:
          - car_ce
        bundle_identifier: master.trivia

    scripts:
      - name: Check Xcode version
        script: xcodebuild -version

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          find . -name "Podfile" -execdir pod install \;

      - name: Generate app icons
        script: dart run flutter_launcher_icons

      - name: Run tests
        script: flutter test

      - name: Build iOS (signed)
        script: |
          xcode-project use-profiles
          flutter build ios --release --no-codesign
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner

      - name: Rename IPA to ASCII filename
        script: |
          mv build/ios/ipa/*.ipa build/ios/ipa/yadaan.ipa

    artifacts:
      - build/ios/ipa/yadaan.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
