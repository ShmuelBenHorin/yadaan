name: yidaan
description: "ידען — חידון שלבים"
publish_to: 'none'
version: 1.7.19+67

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  purchases_flutter: ^8.0.0
  shared_preferences: ^2.2.3   # ← חדש! לשמירת התקדמות שלבים ואנרגיה
  google_mobile_ads: ^5.1.0    # ← AdMob פרסומות
  audioplayers: ^6.1.0         # ← סאונד במובייל (iOS / Android)
  url_launcher: ^6.3.0
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  google_sign_in: ^6.2.0
  in_app_review: ^2.0.9
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  ios: true
  android: true
  image_path: "screen shots/icon_512.png"
  remove_alpha_ios: true

flutter_native_splash:
  # התמונה מכסה את כל המסך (רקע + לוגו + טקסט הכל כלול בתמונה אחת)
  background_image: assets/splash/splash.png
  fullscreen: true
  android: true
  ios: true
  android_12:
    # ל-Android 12+ יש API חדש שתומך רק באייקון על צבע אחיד, לא בתמונה מלאה —
    # לכן מכבים אותו כאן כדי שגם שם תוצג התמונה המלאה בשיטה הישנה (תואם-לאחור)
    android: false

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/splash/